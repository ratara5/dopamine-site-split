<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#FEFCBF" rx="32"/>
  <!-- Decorative background circle -->
  <circle cx="256" cy="256" r="200" fill="#F6E05E" opacity="0.6"/>
  
  <!-- Market Basket Graphic -->
  <g transform="translate(100, 100)">
    <!-- Basket Handles -->
    <path d="M 90,120 L 120,50 L 192,50 L 222,120" fill="none" stroke="#D69E2E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Basket Body -->
    <path d="M 40,120 L 60,280 Q 64,300 84,300 L 228,300 Q 248,300 252,280 L 272,120 Z" fill="#ECC94B" stroke="#D69E2E" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Basket Weave Lines -->
    <line x1="90" y1="150" x2="105" y2="270" stroke="#B7791F" stroke-width="6" stroke-linecap="round"/>
    <line x1="156" y1="150" x2="156" y2="270" stroke="#B7791F" stroke-width="6" stroke-linecap="round"/>
    <line x1="222" y1="150" x2="207" y2="270" stroke="#B7791F" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Top Rim -->
    <rect x="30" y="110" width="252" height="20" rx="10" fill="#D69E2E"/>
  </g>
</svg>
