# Full stack split across dedicated services on a single VPS.
# Only Caddy binds to the host's public ports 80/443 — everything
# else (postgres, backend, worker, frontend, minio) is reachable only
# over the internal Docker network, by service name.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    # No `ports:` mapping on purpose — not reachable from outside the
    # VPS at all, only from other containers on the `internal` network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CRON_SECRET: ${CRON_SECRET}
      NODE_ENV: production
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [internal]
    # No public ports — Caddy proxies to this container by service
    # name over the internal network.

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TRACKING_INTERVAL_MS: ${TRACKING_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on: [backend]
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    networks: [internal]
    # No public ports — served through Caddy at media.yourdomain.com
    # for object GETs; the MinIO console (9001) is intentionally NOT
    # exposed publicly. Use `docker compose exec` + port-forwarding
    # over SSH if you need the console UI.

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    networks: [internal]
    restart: "no"
    # `mc` has no built-in wait-for-ready flag, so this retries the
    # alias/bucket setup for up to ~30s while MinIO finishes booting,
    # then creates the bucket if missing and makes it publicly
    # downloadable (read-only) since it's meant for public-facing
    # media (product/provider images), not private user files. Revisit
    # this policy if you later store anything sensitive in MinIO.
    entrypoint: >
      /bin/sh -c "
      for i in $(seq 1 30); do
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY} && break;
        sleep 1;
      done &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      mc anonymous set download local/${S3_BUCKET}
      "
    # Runs once on `docker compose up`, creates the bucket if missing,
    # and makes objects in it publicly downloadable (read-only) since
    # this bucket is meant for public-facing media (product/provider
    # images), not private user files. Revisit this policy if you
    # later store anything sensitive in MinIO.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend, minio]
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
